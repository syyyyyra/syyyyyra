<svg width="620" height="80" xmlns="http://www.w3.org/2000/svg">
  <style>
    .skill { font: bold 16px 'Segoe UI', sans-serif; fill: #EC4899; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .a { animation: float 2s ease-in-out infinite; }
    .b { animation: float 2.2s ease-in-out infinite 0.2s; }
    .c { animation: float 2.4s ease-in-out infinite 0.4s; }
    .d { animation: float 2.1s ease-in-out infinite 0.1s; }
    .e { animation: float 2.3s ease-in-out infinite 0.3s; }
    .f { animation: float 2.5s ease-in-out infinite 0.5s; }
  </style>
  <text class="skill a" x="10" y="30">C</text>
  <text class="skill b" x="70" y="30">JavaScript</text>
  <text class="skill c" x="180" y="30">TypeScript</text>
  <text class="skill d" x="290" y="30">React</text>
  <text class="skill e" x="370" y="30">Next.js</text>
  <text class="skill f" x="470" y="30">NestJS</text>
</svg>
