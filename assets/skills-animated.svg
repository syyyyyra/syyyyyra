<!-- Save as assets/skills-animated.svg -->
<svg width="600" height="80" xmlns="http://www.w3.org/2000/svg">
  <style>
    .skill { font: bold 16px sans-serif; fill: #8b5cf6; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .a { animation: float 2s ease-in-out infinite; }
    .b { animation: float 2.2s ease-in-out infinite 0.2s; }
    .c { animation: float 2.4s ease-in-out infinite 0.4s; }
  </style>
  <text class="skill a" x="20" y="30">C</text>
  <text class="skill b" x="80" y="30">JavaScript</text>
  <text class="skill c" x="190" y="30">TypeScript</text>
  <text class="skill a" x="300" y="30">React</text>
  <text class="skill b" x="380" y="30">Next.js</text>
  <text class="skill c" x="480" y="30">NestJS</text>
</svg>